name: Compilar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Compilar APK de prueba
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk TecladoXP.apk

      - uses: actions/upload-artifact@v6
        with:
          name: TecladoXP-apk
          path: TecladoXP.apk

      # Publica el APK como versión para que la app se actualice sola
      - name: Publicar versión
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Teclado XP 1.${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: TecladoXP.apk
          make_latest: true
